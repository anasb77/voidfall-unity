name: CI

# VoidFall continuous integration.
#
# REQUIREMENTS (one-time repo setup):
#   1. Add repository secret UNITY_LICENSE containing the personal-use or
#      pro license .ulf contents (see https://game.ci/documentation for
#      activation via unity-activation workflow).
#   2. Optional: UNITY_EMAIL / UNITY_PASSWORD / UNITY_SERIAL for pro seats.
#
# A green foundation-validation result requires both suites, the canonical
# Windows builder, and an advancing Windows player smoke. Missing credentials
# fail explicitly. Require foundation-validation in repository branch rules.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against committed Library artifacts
        run: |
          if git ls-files | grep -qE "^Library/|\.meta$.*Library"; then
            echo "::error::Library artifacts must not be tracked"; exit 1
          fi
          echo "ok"
      - name: Docs present
        run: |
          test -f README.md
          test -f Docs/Architecture.md
          test -f Docs/RefactoringPlaybook.md
          test -f Docs/Design/VoidFallArenaArchitecture.md
          test -f Docs/AI/UnityProjectContext.md
          test -f Docs/AI/UnityProjectHealth.md
          test -f Docs/AudioCredits.md
          echo "docs ok"

  unity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require Unity credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_SERIAL" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Unity validation cannot run. Configure UNITY_LICENSE or the Pro credential set. Fork pull requests need a trusted maintainer run."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ matrix.suite }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-${{ matrix.suite }}-

      - name: Run ${{ matrix.suite }} tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          testMode: ${{ matrix.suite }}
          artifactsPath: test-results/${{ matrix.suite }}
          customParameters: -vfprofile /tmp/voidfall-ci-profile.json
          coverageEnabled: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/

  windows-build:
    needs: unity-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-win64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-win64-
      - name: Build Windows through the production entry point
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: VoidFall.EditorTools.BuildScript.BuildWindows
          customParameters: -vfbuildoutput build/StandaloneWindows64 -vfsource ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-player
          path: build/StandaloneWindows64/
          if-no-files-found: error

  windows-smoke:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-player
          path: build/StandaloneWindows64/
      - name: Verify advancing player combat with an isolated save
        shell: pwsh
        run: ./Tools/Validation/Smoke-Player.ps1 -PlayerPath ./build/StandaloneWindows64/VoidFall.exe -OutputDirectory ./test-results/windows-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: test-results/windows-smoke/

  foundation-validation:
    if: always()
    needs: [docs-lint, unity-tests, windows-build, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every foundation check
        env:
          DOCS: ${{ needs.docs-lint.result }}
          TESTS: ${{ needs.unity-tests.result }}
          BUILD: ${{ needs.windows-build.result }}
          SMOKE: ${{ needs.windows-smoke.result }}
        run: |
          for result in "$DOCS" "$TESTS" "$BUILD" "$SMOKE"; do
            if [ "$result" != "success" ]; then
              echo "::error::Foundation validation is incomplete or failed. Check the required jobs."
              exit 1
            fi
          done
