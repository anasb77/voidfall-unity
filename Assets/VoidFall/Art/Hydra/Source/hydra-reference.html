<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VoidFall Hydra approved reference renderer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#hydra-v13{margin:0!important;max-width:none!important;width:100%;height:100%}
#hydra-v13>h2,#hydra-v13>.controls,#hydra-v13>.attack-tabs{display:none!important}
#hydra-v13 .hero{width:100%;height:100%;border-radius:0!important;box-shadow:none!important;background:transparent!important}
#hydra-v13 svg{width:100%!important;height:100%!important;aspect-ratio:auto!important}
</style>
</head>
<body>
<div id="hydra-v13" data-attack="marrow" data-phase="windup">
  <style>
    #hydra-v13{max-width:1100px;margin:0 auto}
    #hydra-v13 h2{white-space:normal;overflow-wrap:anywhere}
    #hydra-v13 .controls{display:flex;align-items:center;gap:10px;margin:12px 0 14px;flex-wrap:wrap}
    #hydra-v13 .control{min-height:44px;padding:10px 15px;border:0;border-radius:9px;background:var(--primary);color:var(--primary-foreground);font:inherit;font-weight:600;cursor:pointer}
    #hydra-v13 .damage-control{background:#a7ff47;color:#071006}
    #hydra-v13 .control:disabled{opacity:.35;cursor:not-allowed}
    #hydra-v13 .status{min-width:280px;color:var(--muted-foreground)}
    #hydra-v13 .hero{overflow:hidden;border-radius:16px;background:#000201;box-shadow:0 28px 95px rgba(0,0,0,.52)}
    #hydra-v13 svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
    #hydra-v13 .matrix-scroll{animation:h13Matrix 1.05s linear infinite;transition:opacity .35s ease}
    #hydra-v13.off .matrix-scroll{opacity:.8;animation-duration:1.3125s}
    #hydra-v13 .tissue{opacity:.42;animation:h13Tissue 1.6s linear infinite;transition:opacity .35s ease}
    #hydra-v13.off .tissue{opacity:.212;animation-duration:2.5s}
    #hydra-v13 .skeleton{opacity:1;filter:brightness(1.26) contrast(1.06);transition:opacity .35s ease,filter .35s ease}
    #hydra-v13.off .skeleton{opacity:.61;filter:brightness(.82) contrast(.96)}
    #hydra-v13 .boss{opacity:1;transition:opacity .35s ease}
    #hydra-v13.off .boss{opacity:0;pointer-events:none}
    #hydra-v13 #h13BossBody{animation:h13IdleShake 1.45s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #hydra-v13[data-phase="strike"] #h13BossBody{animation:h13AttackShake .115s steps(2,end) infinite}
    #hydra-v13.evading #h13BossBody{animation:none;transition:transform .08s linear,opacity .06s linear}
    #hydra-v13 .brain{animation:h13Beat 3.15s cubic-bezier(.3,0,.2,1) infinite;transform-origin:550px 111px}
    #hydra-v13 .jaw{animation:h13Jaw 2.8s ease-in-out infinite;transform-origin:550px 184px}
    #hydra-v13 .blood{stroke-dasharray:4 11;animation:h13Flow 1.15s linear infinite}
    #hydra-v13 .anchor{animation:h13Anchor 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    #hydra-v13 .attack{display:none;pointer-events:none}
    #hydra-v13[data-attack="marrow"] .attack-marrow,#hydra-v13[data-attack="evasion"] .attack-evasion,#hydra-v13[data-attack="rib"] .attack-rib,#hydra-v13[data-attack="optic"] .attack-optic{display:block}
    #hydra-v13 .attack-tabs{margin:0 0 12px;flex-wrap:wrap}
    #hydra-v13 .telegraph{transition:opacity .18s ease}
    #hydra-v13[data-phase="windup"] .attack .strike-mark{opacity:.18}
    #hydra-v13[data-phase="strike"] .attack .windup-mark{opacity:.22}
    #hydra-v13[data-phase="recovery"] .attack{opacity:.34}
    #hydra-v13[data-attack="marrow"] .phase-player{animation:none}
    #hydra-v13 #h13PlayerAnchor{transition:transform .38s cubic-bezier(.2,.85,.25,1);transform-box:view-box}
    #hydra-v13 .marrow-bomb{opacity:0}
    #hydra-v13 .marrow-bomb.armed{opacity:1}
    #hydra-v13 .bomb-projectile{transform:translateY(-330px);transform-box:fill-box;transform-origin:center;transition:transform .42s cubic-bezier(.35,.02,.8,.45),opacity .06s linear}
    #hydra-v13 .marrow-bomb.armed .bomb-projectile{transform:translateY(0)}
    #hydra-v13 .marrow-bomb.impact .bomb-projectile{opacity:0}
    #hydra-v13 .bomb-target{animation:h13BombTarget .38s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    #hydra-v13 .bomb-blast{opacity:0;transform-box:fill-box;transform-origin:center}
    #hydra-v13 .marrow-bomb.impact .bomb-blast{animation:h13BombBlast .58s ease-out forwards}
    #hydra-v13 .tentacle{animation:h13Tentacle 1.7s ease-in-out infinite alternate;transform-box:view-box}
    #hydra-v13 .tentacle:nth-child(even){animation-direction:alternate-reverse}
    #hydra-v13 .tentacle-flow{stroke-dasharray:5 13;animation:h13ToxinFlow .72s linear infinite}
    #hydra-v13 .toxin-spore{animation:h13Spore 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    #hydra-v13 .evasion-ring{animation:h13Ring 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    #hydra-v13 .rib-left,#hydra-v13 .rib-right{transition:transform .16s cubic-bezier(.2,.9,.2,1)}
    #hydra-v13[data-phase="windup"] .rib-left{transform:translateX(-115px)}
    #hydra-v13[data-phase="windup"] .rib-right{transform:translateX(115px)}
    #hydra-v13[data-phase="strike"] .rib-left{transform:translateX(125px)}
    #hydra-v13[data-phase="strike"] .rib-right{transform:translateX(-125px)}
    #hydra-v13 .optic-sweep{transform-origin:550px 119px;animation:h13Sweep 1.1s ease-in-out infinite alternate}
    #hydra-v13 .optic-core{animation:h13LaserCore .12s steps(2,end) infinite}
    #hydra-v13 .optic-impact{animation:h13Impact .55s ease-out infinite;transform-box:fill-box;transform-origin:center}
    #hydra-v13 .phase-player{animation:h13PhaseWalk 4.5s ease-in-out infinite;transform-origin:center}
    #hydra-v13 .damage-particle{filter:url(#h13glow)}
    #hydra-v13 .damage-meter{height:7px;flex:1 1 180px;max-width:260px;overflow:hidden;border-radius:99px;background:color-mix(in srgb,var(--muted) 65%,transparent)}
    #hydra-v13 .damage-meter>i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff5d4f,#f8ea63,#74ff65);transform-origin:left;transition:transform .08s linear}
    @keyframes h13Matrix{to{transform:translateY(140px)}}
    @keyframes h13Tissue{to{transform:translateY(24px)}}
    @keyframes h13Beat{0%,42%,100%{transform:scale(1)}47%{transform:scale(1.035)}52%{transform:scale(1.01)}58%{transform:scale(1.065)}66%{transform:scale(1)}}
    @keyframes h13Jaw{0%,76%,100%{transform:translateY(0)}82%{transform:translateY(7px)}87%{transform:translateY(1px)}92%{transform:translateY(9px)}}
    @keyframes h13Flow{to{stroke-dashoffset:-30}}
    @keyframes h13Anchor{from{opacity:.62;transform:scale(.96)}to{opacity:1;transform:scale(1.06)}}
    @keyframes h13Telegraph{from{opacity:.18}to{opacity:.92}}
    @keyframes h13BombTarget{from{transform:scale(.9);opacity:.45}to{transform:scale(1.08);opacity:1}}
    @keyframes h13BombBlast{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
    @keyframes h13ToxinFlow{to{stroke-dashoffset:-36}}
    @keyframes h13Tentacle{from{transform:rotate(-3.8deg) scaleY(.97)}to{transform:rotate(4.2deg) scaleY(1.035)}}
    @keyframes h13Spore{from{transform:translateY(0) scale(.82);opacity:.32}to{transform:translateY(-16px) scale(1.2);opacity:.82}}
    @keyframes h13Ring{0%{transform:scale(.25);opacity:1}100%{transform:scale(1.7);opacity:0}}
    @keyframes h13Sweep{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}
    @keyframes h13LaserCore{from{opacity:.76;stroke-width:5}to{opacity:1;stroke-width:9}}
    @keyframes h13Impact{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
    @keyframes h13PhaseWalk{0%,100%{transform:translateY(72px)}50%{transform:translateY(-105px)}}
    @keyframes h13IdleShake{0%,100%{transform:translate(0,0) rotate(0)}22%{transform:translate(-1.5px,.5px) rotate(-.18deg)}48%{transform:translate(1px,-.5px) rotate(.12deg)}74%{transform:translate(-.7px,0) rotate(-.08deg)}}
    @keyframes h13AttackShake{0%{transform:translate(-13px,-2px) rotate(-1.35deg)}25%{transform:translate(9px,3px) rotate(.9deg)}50%{transform:translate(-8px,1px) rotate(-.75deg)}75%{transform:translate(14px,-3px) rotate(1.4deg)}100%{transform:translate(-11px,2px) rotate(-1deg)}}
    @media(max-width:560px){#hydra-v13 .attack-tabs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#hydra-v13 .attack-tabs .nav-link{white-space:normal;text-align:left}}
    @media(prefers-reduced-motion:reduce){#hydra-v13 .matrix-scroll,#hydra-v13 .tissue,#hydra-v13 .brain,#hydra-v13 .jaw,#hydra-v13 .blood,#hydra-v13 .anchor,#hydra-v13 .telegraph,#hydra-v13 .phase-player,#hydra-v13 .bomb-target,#hydra-v13 .bomb-blast,#hydra-v13 .tentacle,#hydra-v13 .tentacle-flow,#hydra-v13 .toxin-spore,#hydra-v13 .optic-core,#hydra-v13 .optic-impact{animation:none}}
  </style>

  <script>
    (()=>{
      const root=document.getElementById('hydra-v13');
      const boss=document.getElementById('h13Boss');
      const damage=document.getElementById('h13Damage');
      const status=document.getElementById('h13Status');
      const cuts=document.getElementById('h13PixelCuts');
      const sand=document.getElementById('h13Sand');
      const meter=document.getElementById('h13Meter');
      const arena=document.getElementById('h13Arena');
      const bossBody=document.getElementById('h13BossBody');
      const playerAnchor=document.getElementById('h13PlayerAnchor');
      const attackButtons=[...root.querySelectorAll('.attack-pick')];
      const marrowBombs=[...root.querySelectorAll('.marrow-bomb')];
      if(!root||!boss||!damage||!status||!cuts||!sand||!meter||!arena||!bossBody||!playerAnchor||attackButtons.length!==4||marrowBombs.length!==4)return;

      const ns='http://www.w3.org/2000/svg';
      const attacks={
        marrow:{name:'Marrow Barrage',windup:'four marrow bombs prime',strike:'bombs track the player one by one',recovery:'impact zones dissolve'},
        evasion:{name:'Evasion',windup:'six escape sockets lock',strike:'invulnerable head chooses a new random route',recovery:'head rematerializes at the crown'},
        rib:{name:'Rib Guillotine',windup:'outer ribs retract',strike:'rib walls scissor inward',recovery:'central corridor reopens'},
        optic:{name:'Optic Rupture',windup:'eye tracks the player',strike:'rupture laser sweeps — cross through the spine',recovery:'pupil overheats'}
      };
      const damageStarts=[0,.15,.32,.49,.67,.84];
      const damageSpans=[.15,.17,.17,.18,.17,.16];
      const basePhaseDurations={windup:1250,strike:1050,recovery:850};
      const marrowPositions=[{x:550,y:430},{x:398,y:362},{x:694,y:348},{x:447,y:520},{x:655,y:518},{x:312,y:438},{x:790,y:448},{x:510,y:298},{x:610,y:286},{x:270,y:530},{x:830,y:522}];
      const evasionOffsets=[{x:-374,y:-8},{x:-208,y:-45},{x:208,y:-45},{x:374,y:-8},{x:373,y:381},{x:-373,y:381}];
      let currentAttack='marrow',combatPhase='windup',phaseTimer=null;
      let actionTimers=[],lastEvasionIndex=-1,marrowBombStep=0;
      let damageFrame=null,damageStart=0,lastFrame=0,integrity=100,nextCut=0,lastStatusKey='';
      const cells=[];
      const particles=[];

      const hash=(x,y)=>(Math.abs(Math.sin(x*12.9898+y*78.233)*43758.5453)%1);
      for(let y=-16;y<=252;y+=7){
        for(let x=389;x<=711;x+=7){
          const inEye=Math.pow((x-550)/43,2)+Math.pow((y-119)/51,2)<1;
          let region;
          if(inEye)region=5;
          else if(y<61)region=0;
          else if(y<174&&x>=550)region=1;
          else if(y<174)region=2;
          else if(x>=550)region=3;
          else region=4;
          const threshold=damageStarts[region]+hash(x,y)*damageSpans[region];
          const node=document.createElementNS(ns,'rect');
          const size=6.7+(hash(y,x)>.76?2.4:0);
          node.setAttribute('x',x.toFixed(1));node.setAttribute('y',y.toFixed(1));
          node.setAttribute('width',size.toFixed(1));node.setAttribute('height',size.toFixed(1));
          node.setAttribute('opacity','0');
          cuts.appendChild(node);
          cells.push({x,y,region,threshold,node});
        }
      }
      cells.sort((a,b)=>a.threshold-b.threshold);

      const particleColors=['#cbff57','#87ff69','#48df57','#176f35','#071d0d'];
      for(let i=0;i<120;i++){
        const node=document.createElementNS(ns,'rect');
        const size=3+(i%4)*1.6;
        node.setAttribute('width',size.toFixed(1));node.setAttribute('height',size.toFixed(1));
        node.setAttribute('rx',i%5===0?'1':'0');node.setAttribute('opacity','0');
        sand.appendChild(node);
        particles.push({node,active:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:1});
      }

      const spawnParticle=(cell,index)=>{
        const p=particles.find(item=>!item.active)||particles[index%particles.length];
        const jitter=hash(cell.x+index,cell.y-index);
        p.active=true;p.x=cell.x;p.y=cell.y;
        p.vx=(cell.x-550)*.18+(jitter-.5)*115;p.vy=-62+jitter*78;
        p.life=0;p.maxLife=.9+jitter*.95;
        p.node.setAttribute('fill',particleColors[(cell.region+index)%particleColors.length]);
        p.node.setAttribute('opacity','1');
      };

      const updateParticles=dt=>{
        particles.forEach(p=>{
          if(!p.active)return;
          p.life+=dt;
          if(p.life>=p.maxLife){p.active=false;p.node.setAttribute('opacity','0');return;}
          p.vy+=185*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
          p.node.setAttribute('x',p.x.toFixed(1));p.node.setAttribute('y',p.y.toFixed(1));
          p.node.setAttribute('opacity',String(Math.max(0,1-p.life/p.maxLife)));
        });
      };

      const setStatus=(force=false)=>{
        let value;
        if(root.classList.contains('off'))value='Boss absent · patterns −20% opacity and speed';
        else{
          const detail=attacks[currentAttack][combatPhase];
          const health=damageFrame?` · integrity ${integrity}%`:'';
          const count=currentAttack==='marrow'&&combatPhase==='strike'?` · bomb ${marrowBombStep}/4`:'';
          value=`${attacks[currentAttack].name} · ${combatPhase.toUpperCase()} · ${detail}${count}${health}`;
        }
        const key=root.classList.contains('off')?'off':`${currentAttack}-${combatPhase}-${damageFrame?Math.floor(integrity/10):'full'}`;
        if(force||key!==lastStatusKey){status.textContent=value;lastStatusKey=key;}
      };

      const shuffleIndices=(length,previous=-1)=>{
        const values=Array.from({length},(_,index)=>index);
        for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]];}
        if(values.length>1&&values[0]===previous)[values[0],values[1]]=[values[1],values[0]];
        return values;
      };

      const stopActionState=()=>{
        actionTimers.forEach(timer=>clearTimeout(timer));actionTimers=[];
        root.classList.remove('evading');
        bossBody.style.transform='';bossBody.style.opacity='';bossBody.style.transition='';
        marrowBombs.forEach(bomb=>{bomb.classList.remove('armed','impact');bomb.removeAttribute('transform');});
        playerAnchor.style.transform='translate(550px,430px)';
      };

      const startMarrowBarrage=()=>{
        marrowBombStep=0;
        const route=[marrowPositions[0]];let available=marrowPositions.slice(1);
        while(route.length<5){
          const current=route[route.length-1];
          const eligible=available.filter(point=>Math.hypot(point.x-current.x,point.y-current.y)>=155);
          const pool=eligible.length?eligible:available;const next=pool[Math.floor(Math.random()*pool.length)];
          route.push(next);available=available.filter(point=>point!==next);
        }
        playerAnchor.style.transform=`translate(${route[0].x}px,${route[0].y}px)`;
        marrowBombs.forEach((bomb,index)=>{
          const target=route[index];const escape=route[index+1];
          const launch=setTimeout(()=>{
            marrowBombStep=index+1;setStatus(true);
            bomb.setAttribute('transform',`translate(${target.x} ${target.y})`);
            bomb.classList.remove('armed','impact');void bomb.getBBox();bomb.classList.add('armed');
            actionTimers.push(setTimeout(()=>{playerAnchor.style.transform=`translate(${escape.x}px,${escape.y}px)`;},125));
            actionTimers.push(setTimeout(()=>bomb.classList.add('impact'),430));
          },index*520);
          actionTimers.push(launch);
        });
      };

      const startEvasion=()=>{
        root.classList.add('evading');bossBody.style.transition='transform .08s linear,opacity .06s linear';
        const order=shuffleIndices(evasionOffsets.length,lastEvasionIndex);lastEvasionIndex=order[order.length-1];
        order.forEach((spotIndex,index)=>{
          const jump=setTimeout(()=>{
            const spot=evasionOffsets[spotIndex];bossBody.style.opacity='0';
            actionTimers.push(setTimeout(()=>{bossBody.style.transform=`translate(${spot.x}px,${spot.y}px) scale(.36)`;bossBody.style.opacity='1';},65));
          },index*380);
          actionTimers.push(jump);
        });
      };

      const phaseDuration=phase=>{
        if(phase==='strike'&&currentAttack==='marrow')return 2450;
        if(phase==='strike'&&currentAttack==='evasion')return 2500;
        if(phase==='windup'&&(currentAttack==='marrow'||currentAttack==='evasion'))return 1050;
        return basePhaseDurations[phase];
      };

      const schedulePhase=phase=>{
        stopActionState();
        combatPhase=phase;root.setAttribute('data-phase',phase);setStatus(true);
        if(phase==='strike'&&currentAttack==='marrow')startMarrowBarrage();
        if(phase==='strike'&&currentAttack==='evasion')startEvasion();
        clearTimeout(phaseTimer);
        const next=phase==='windup'?'strike':phase==='strike'?'recovery':'windup';
        phaseTimer=setTimeout(()=>schedulePhase(next),phaseDuration(phase));
      };

      const selectAttack=key=>{
        stopActionState();
        currentAttack=key;root.setAttribute('data-attack',key);
        attackButtons.forEach(button=>{
          const selected=button.dataset.pick===key;
          button.classList.toggle('active',selected);
          button.setAttribute('aria-selected',String(selected));
          if(selected)arena.setAttribute('aria-labelledby',button.id);
        });
        schedulePhase('windup');
      };

      const resetDamage=()=>{
        integrity=100;nextCut=0;
        cells.forEach(cell=>cell.node.setAttribute('opacity','0'));
        particles.forEach(p=>{p.active=false;p.node.setAttribute('opacity','0');});
        meter.style.transform='scaleX(1)';setStatus(true);
      };

      const stopDamage=(reset=true)=>{
        if(damageFrame){cancelAnimationFrame(damageFrame);damageFrame=null;}
        damage.setAttribute('aria-pressed','false');damage.textContent='Damage: OFF';
        if(reset)resetDamage();
      };

      const renderDamage=time=>{
        if(!damageStart){damageStart=time;lastFrame=time;}
        if(time-damageStart>=16800){resetDamage();damageStart=time;lastFrame=time;}
        const progress=Math.min(1,(time-damageStart)/15000);
        while(nextCut<cells.length&&cells[nextCut].threshold<=progress){
          const cell=cells[nextCut];cell.node.setAttribute('opacity','1');
          if(nextCut%3===0)spawnParticle(cell,nextCut);nextCut++;
        }
        const dt=Math.min(.05,(time-lastFrame)/1000);lastFrame=time;updateParticles(dt);
        integrity=Math.max(0,Math.round((1-progress)*100));meter.style.transform=`scaleX(${1-progress})`;
        setStatus();damageFrame=requestAnimationFrame(renderDamage);
      };

      boss.addEventListener('click',()=>{
        const off=root.classList.toggle('off');
        boss.setAttribute('aria-pressed',String(!off));boss.textContent=off?'Boss: OFF':'Boss: ON';
        damage.disabled=off;attackButtons.forEach(button=>button.disabled=off);
        if(off){clearTimeout(phaseTimer);stopActionState();root.setAttribute('data-attack','none');root.setAttribute('data-phase','idle');stopDamage(true);setStatus(true);}
        else{root.setAttribute('data-attack',currentAttack);schedulePhase('windup');}
      });

      attackButtons.forEach(button=>button.addEventListener('click',()=>{
        if(root.classList.contains('off'))return;
        selectAttack(button.dataset.pick);
      }));

      damage.addEventListener('click',()=>{
        if(root.classList.contains('off'))return;
        if(damageFrame){stopDamage(true);return;}
        damage.setAttribute('aria-pressed','true');damage.textContent='Damage: ON';
        damageStart=0;lastFrame=0;damageFrame=requestAnimationFrame(renderDamage);
      });

      resetDamage();
      selectAttack('marrow');
    })();
  </script>
</div>


<script>
(()=>{
  const layer=new URLSearchParams(location.search).get('layer')||'base';
  const root=document.getElementById('hydra-v13');
  const svg=root.querySelector('svg');
  const direct=[...svg.children];
  const hideAll=()=>direct.forEach(node=>{if(node.tagName.toLowerCase()!=='defs')node.style.display='none';});
  if(layer==='base'){
    direct.forEach(node=>{
      if(node.matches('.skeleton,.boss,.attack')||node.querySelector?.('.anchor,.phase-player')||node.querySelector?.('text'))node.style.display='none';
    });
    svg.setAttribute('viewBox','0 0 1100 620');
    svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  }else if(layer==='details'){
    hideAll();
    const skeleton=svg.querySelector('.skeleton');
    if(skeleton)skeleton.style.display='';
    const anchor=svg.querySelector('.anchor');
    const anchorLayer=anchor?.parentElement;
    if(anchorLayer){anchorLayer.style.display='';anchorLayer.querySelectorAll('.anchor').forEach(node=>node.style.display='');}
    svg.setAttribute('viewBox','0 0 1100 620');
    svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  }else if(layer==='boss'){
    hideAll();
    const boss=svg.querySelector('.boss');
    if(boss){
      boss.style.display='';
      [...boss.children].forEach(node=>node.style.display=node.id==='h13BossBody'?'':'none');
    }
    svg.setAttribute('viewBox','350 -70 400 400');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  }
  root.querySelectorAll('*').forEach(node=>{
    node.style.animation='none';
  });
})();
</script>
